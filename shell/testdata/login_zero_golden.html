<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/admin/static/pm7.css"><style>
				:root{
					--pm7-background:#141414;--pm7-foreground:#d6d6d6;--pm7-muted:#1f1f1f;
					--pm7-muted-foreground:#9a9a9a;--pm7-border:#2b2b2b;--pm7-input:#282828;
					--pm7-primary:#0078d4;--pm7-primary-hover:#006abe;--pm7-primary-foreground:#fff;
					--pm7-radius:.625rem;
					--bg-deep:#141414;--bg-surface:#1f1f1f;--bg-elevated:#282828;--accent:#0078d4;--accent-text:#4daafc;
					--accent-glow:rgba(0,120,212,.15);--text-primary:#d6d6d6;
					--text-secondary:#9a9a9a;--border:#2b2b2b;--negative:#f28b82;--negative-bg:#3a1d1a;
					--font-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
				}
				*{box-sizing:border-box}
				body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-sans);font-size:.9375rem;padding:1.5rem}
				.login-shell{width:100%;max-width:22rem}
				.login-card{width:100%;padding:2rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:.625rem}
				.login-title{margin:0 0 1.5rem;font-size:1.375rem;line-height:1.2;letter-spacing:-.012em;font-weight:650;color:var(--text-primary);text-align:center}
				.login-error{margin-bottom:1rem;padding:.5rem .75rem;border-radius:.375rem;background:var(--negative-bg);border:1px solid var(--negative);color:var(--negative);font-size:.8125rem;text-align:center}
				.login-field{margin-bottom:1rem}
				.login-field label{display:block;margin-bottom:.375rem;font-size:.8125rem;color:var(--text-secondary)}
				.login-form .pm7-input{width:100%;padding:.5rem .75rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:.375rem;color:var(--text-primary);font-size:.875rem;outline:none;transition:border-color .15s,box-shadow .15s}
				.login-form .pm7-input:focus{border-color:var(--accent)}
				.login-form .pm7-input:focus-visible,.login-submit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
				.pw-wrap{position:relative}
				.pw-wrap .pm7-input{padding-right:2.75rem}
				.pw-toggle{position:absolute;top:0;right:0;height:100%;width:2.75rem;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:0}
				.pw-toggle:hover{color:var(--text-primary)}
				.pw-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:.5rem}
				.pw-toggle svg{width:1.125rem;height:1.125rem;display:block}
				.pw-toggle svg[hidden]{display:none}
				.login-submit{width:100%;margin-top:.25rem;padding:.625rem;background:var(--accent);color:#fff;border:none;border-radius:.375rem;font-size:.875rem;font-weight:600;cursor:pointer;transition:background-color .15s}
				.login-submit:hover{background:var(--pm7-primary-hover)}
				.login-links{margin-top:1rem;display:flex;flex-direction:column;gap:.5rem;text-align:center}
				.login-links a{color:var(--accent-text);font-size:.8125rem;text-decoration:none}
				.login-links a:hover{text-decoration:underline}
			</style></head><body><main class="login-shell"><div class="pm7-card login-card"><div class="pm7-card-content"><h1 class="login-title">Admin</h1><div class="login-error" role="alert">bad creds</div><form method="POST" action="/admin/login" class="login-form"><div class="login-field"><label for="username">Username</label> <input id="username" name="username" type="text" autocomplete="username" required autofocus class="pm7-input"></div><div class="login-field"><label for="password">Password</label><div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required class="pm7-input"> <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" data-label-show="Show password" data-label-hide="Hide password" aria-pressed="false"><svg class="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path> <circle cx="12" cy="12" r="3"></circle></svg> <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"></path></svg></button></div></div><button type="submit" class="pm7-button pm7-button--primary login-submit">Sign in</button></form><nav class="login-links"><a href="/help">Help</a></nav></div></div></main><script src="/admin/static/pm7.js"></script><script>
				(function(){
					var btn=document.getElementById('pw-toggle');
					if(!btn){return;}
					var inp=document.getElementById('password');
					var eye=btn.querySelector('.pw-eye');
					var off=btn.querySelector('.pw-eye-off');
					btn.addEventListener('click',function(){
						var show=inp.type==='password';
						inp.type=show?'text':'password';
						btn.setAttribute('aria-pressed',show?'true':'false');
						btn.setAttribute('aria-label',btn.getAttribute(show?'data-label-hide':'data-label-show'));
						if(eye){eye.hidden=show;}
						if(off){off.hidden=!show;}
					});
				})();
			</script></body></html>
