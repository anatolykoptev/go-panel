<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f172a'/><text x='6' y='22' font-size='18' fill='%233b82f6'>⚙</text></svg>"><link rel="stylesheet" href="/admin/static/pm7.css"><style>
		/* ── Light palette (default, bare :root) ────────────────────────────
		   WCAG AA contrast ratios (4.5:1 threshold for normal text).
		   Ratios measured against the backgrounds each token actually sits
		   on, not just --bg-base. --text-muted and --badge-gray-fg are used
		   on --bg-surface (#f1f5f9) and --bg-elevated (#e2e8f0) — tables,
		   cards, detail sections, badges — so they must clear 4.5:1 on
		   --bg-elevated (the darkest). --accent-link is a separate token
		   for link/foreground use; --accent (the fill behind white text in
		   .filter-chip.active, .login-submit) is NOT darkened — darkening
		   the fill changes a different pair.

		     --text-primary  #0f172a  17.9/16.2/14.7  ✓ (base/surface/elevated)
		     --text-secondary #475569  7.6/6.9/6.2    ✓
		     --text-muted    #4f5b6b   6.9/6.3/5.6    ✓
		     --text-label    #334155  10.4/9.4/8.5    ✓
		     --accent-link   #2563eb   5.2/4.7        ✓ (base/surface)
		   pm7 token overrides are re-valued (not deleted) because pm7.css
		   ships its own @media (prefers-color-scheme: dark) :root block that
		   would override the cookie choice when the OS is in dark mode.
		   Keeping explicit light values here ensures the cookie wins over
		   the OS preference — the inline <style> renders after the pm7.css
		   <link>, so same-specificity :root here beats pm7's media-query :root. */
		:root{
			--bg-deep:#f8fafc;
			--bg-base:#ffffff;
			--bg-surface:#f1f5f9;
			--bg-elevated:#e2e8f0;
			--border:#cbd5e1;
			--border-subtle:#e2e8f0;
			--text-primary:#0f172a;
			--text-secondary:#475569;
			--text-muted:#4f5b6b;
			--text-label:#334155;
			--accent:#3b82f6;
			--accent-link:#2563eb;
			--accent-glow:rgba(59,130,246,.12);
			--accent-dim:#dbeafe;
			--green:#10b981;
			--green-dim:#d1fae5;
			--yellow:#f59e0b;
			--yellow-dim:#fef3c7;
			--red:#ef4444;
			--red-dim:#fee2e2;
			--purple:#8b5cf6;
			--purple-dim:#ede9fe;
			--teal:#0ea5e9;
			--teal-dim:#cffafe;
			--orange:#f97316;
			--orange-dim:#ffedd5;
			--font-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
			--font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
			--radius:.5rem;
			--radius-lg:.75rem;
			--pm7-primary:#3b82f6;
			--pm7-primary-hover:#2563eb;
			--pm7-primary-active:#1d4ed8;
			--pm7-primary-foreground:#fff;
			--pm7-background:#ffffff;
			--pm7-foreground:#0f172a;
			--pm7-muted:#f1f5f9;
			--pm7-muted-foreground:#475569;
			--pm7-border:#cbd5e1;
			--pm7-border-hover:#94a3b8;
			--pm7-success:#10b981;
			--pm7-warning:#f59e0b;
			--pm7-error:#ef4444;
			--pm7-radius:.625rem;
			--pm7-surface:var(--bg-surface);
			--pm7-surface-hover:var(--bg-elevated);
			--pm7-surface-active:var(--bg-elevated);
			/* pm7 tokens redefined in pm7.css @media (prefers-color-scheme: dark) :root
			   that were NOT in the original 17 overrides. Light values copied from
			   pm7.css bare :root so the cookie wins over the OS dark preference.
			   Without these, a viewer whose OS is dark but cookie is light gets
			   dark-tuned shadows, dark tooltips, dark scrollbars, etc. on light
			   surfaces. Dark-only tokens (no bare-:root value) are excluded — they
			   are undefined in light mode by design. */
			--pm7-text-primary:var(--pm7-foreground);
			--pm7-text-secondary:var(--pm7-muted-foreground);
			--pm7-menu-bg:var(--pm7-surface);
			--pm7-ring-offset:#ffffff;
			--pm7-input:#ffffff;
			--pm7-card-footer-bg:#f7fafc;
			--pm7-sidebar-bg:#F3F4F6;
			--pm7-sidebar-item-hover:#ffffff;
			--pm7-header-bg:var(--pm7-surface);
			--pm7-footer-bg:#f5f5f5;
			--pm7-footer-text:var(--pm7-text-secondary);
			--pm7-tooltip-bg:#1a1a1a;
			--pm7-tooltip-color:#ffffff;
			--pm7-success-light:#dcfce7;
			--pm7-success-dark:#166534;
			--pm7-warning-light:#fef3c7;
			--pm7-warning-dark:#92400e;
			--pm7-info-light:#dbeafe;
			--pm7-info-dark:#1e40af;
			--pm7-theme-switch-bg:var(--pm7-background);
			--pm7-theme-switch-thumb-bg-light:#FFD43B;
			--pm7-theme-switch-thumb-bg-dark:#6E6E6E;
			--pm7-theme-switch-icon-light:var(--pm7-foreground);
			--pm7-theme-switch-icon-dark:var(--pm7-background);
			--pm7-theme-switch-sun-color:#FFB800;
			--pm7-theme-switch-moon-color:#4A5568;
			--pm7-menu-hover-shadow:rgba(0,0,0,.08) 0px 5px 15px 0px,rgba(25,28,33,.2) 0px 15px 35px -5px;
			--pm7-focus-shadow:0 0 0 3px rgb(28 134 239 / 0.2);
			--pm7-shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.05);
			--pm7-shadow:0 1px 3px 0 rgb(0 0 0 / 0.1),0 1px 2px -1px rgb(0 0 0 / 0.1);
			--pm7-shadow-md:0 4px 6px -1px rgb(0 0 0 / 0.1),0 2px 4px -2px rgb(0 0 0 / 0.1);
			--pm7-shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1),0 4px 6px -4px rgb(0 0 0 / 0.1);
			--pm7-shadow-xl:0 20px 25px -5px rgb(0 0 0 / 0.1),0 8px 10px -6px rgb(0 0 0 / 0.1);
			--pm7-shadow-2xl:0 25px 50px -12px rgb(0 0 0 / 0.25);
			--accent-light:#1e40af;
			--green-light:#065f46;
			--red-light:#991b1b;
			--orange-light:#9a3412;
			--purple-light:#5b21b6;
			--yellow-light:#92400e;
			--btn-primary-bg:#2563eb;
			--btn-primary-hover:#1d4ed8;
			--btn-danger-bg:#b91c1c;
			--btn-danger-hover:#991b1b;
			--badge-gray-fg:#4f5b6b;
			--row-hover-bg:rgba(59,130,246,.07);
			--overlay-bg:rgba(0,0,0,.4);
			--fit-strong-bg:#d1fae5;--fit-strong-fg:#065f46;
			--fit-moderate-bg:#fef3c7;--fit-moderate-fg:#92400e;
			--fit-weak-bg:#ffedd5;--fit-weak-fg:#9a3412;
			--fit-low-bg:#fee2e2;--fit-low-fg:#991b1b;
			--fit-reject-bg:#f1f5f9;--fit-reject-fg:var(--text-muted);
			--fit-unscored-bg:#e2e8f0;--fit-unscored-fg:var(--text-muted);
			--suc-strong-bg:#ede9fe;--suc-strong-fg:#5b21b6;
			--suc-moderate-bg:#f1f5f9;--suc-moderate-fg:#475569;
			--suc-longshot-bg:#fae8ff;--suc-longshot-fg:#86198f;
			--ou-over-fg:#c2410c;
			--ou-under-fg:#dc2626;
		}
		/* ── Dark palette (selected by .dark class on <html>) ──────────────
		   Values are the pre-theme dark palette, unchanged — moved from bare
		   :root to :root.dark so the dark class selects them. The light
		   palette above is the bare-:root default. No media query: the choice
		   is the cookie, not the OS. */
		:root.dark{
			--bg-deep:#060b18;
			--bg-base:#0c1222;
			--bg-surface:#131c31;
			--bg-elevated:#1a2540;
			--border:#1e2d4a;
			--border-subtle:#162038;
			--text-primary:#e8edf5;
			--text-secondary:#7b8ba8;
			--text-muted:#4a5b78;
			--text-label:#5d6f90;
			--accent:#3b82f6;
			--accent-link:var(--accent);
			--accent-glow:rgba(59,130,246,.15);
			--accent-dim:#1e3a6e;
			--green:#10b981;
			--green-dim:#064e3b;
			--yellow:#f59e0b;
			--yellow-dim:#78350f;
			--red:#ef4444;
			--red-dim:#7f1d1d;
			--purple:#a78bfa;
			--purple-dim:#4c1d95;
			--teal:#0ea5e9;
			--teal-dim:#0c3a53;
			--orange:#f97316;
			--orange-dim:#7c2d12;
			--pm7-primary:#3b82f6;
			--pm7-primary-hover:#2563eb;
			--pm7-primary-active:#1d4ed8;
			--pm7-primary-foreground:#fff;
			--pm7-background:#060b18;
			--pm7-foreground:#e8edf5;
			--pm7-muted:#131c31;
			--pm7-muted-foreground:#7b8ba8;
			--pm7-border:#1e2d4a;
			--pm7-border-hover:#4a5b78;
			--pm7-success:#10b981;
			--pm7-warning:#f59e0b;
			--pm7-error:#ef4444;
			--pm7-radius:.625rem;
			--pm7-surface:var(--bg-surface);
			--pm7-surface-hover:var(--bg-elevated);
			--pm7-surface-active:var(--bg-elevated);
			--accent-light:#93c5fd;
			--green-light:#6ee7b7;
			--red-light:#fca5a5;
			--orange-light:#fdba74;
			--purple-light:#c4b5fd;
			--yellow-light:#fcd34d;
			--btn-primary-bg:#2563eb;
			--btn-primary-hover:#1d4ed8;
			--btn-danger-bg:#b91c1c;
			--btn-danger-hover:#991b1b;
			--pm7-input:var(--bg-deep);
			--badge-gray-fg:#9dafc8;
			--row-hover-bg:rgba(59,130,246,.06);
			--overlay-bg:rgba(0,0,0,.5);
			--fit-strong-bg:#0d3a26;--fit-strong-fg:var(--green-light);
			--fit-moderate-bg:#2c2308;--fit-moderate-fg:#fcd34d;
			--fit-weak-bg:#2a1a08;--fit-weak-fg:#fb923c;
			--fit-low-bg:#1f1215;--fit-low-fg:#f87171;
			--fit-reject-bg:#18181e;--fit-reject-fg:var(--text-muted);
			--fit-unscored-bg:#141b2d;--fit-unscored-fg:var(--text-muted);
			--suc-strong-bg:#1a1a3d;--suc-strong-fg:#a78bfa;
			--suc-moderate-bg:#1a2030;--suc-moderate-fg:#94a3b8;
			--suc-longshot-bg:#2a1a2a;--suc-longshot-fg:#c084fc;
			--ou-over-fg:#f97316;
			--ou-under-fg:#f87171;
		}
		*{margin:0;padding:0;box-sizing:border-box}
		body{background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-sans);min-height:100vh;font-size:.875rem;line-height:1.5}
		a{color:var(--accent-link);text-decoration:none}
		a:hover{opacity:.85}
		.app{display:flex;min-height:100vh}
		.main{flex:1;overflow-x:auto;background:var(--bg-base)}
		.sidebar{width:220px;background:var(--bg-deep);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;position:sticky;top:0;height:100vh;align-self:flex-start}
		.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;min-height:56px}
		.sidebar-header h1{font-family:var(--font-mono);font-size:.8125rem;font-weight:600;color:var(--accent);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
		.sidebar-toggle{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.125rem;padding:.25rem;line-height:1;flex-shrink:0;transition:color .15s}
		.sidebar-toggle:hover{color:var(--text-primary)}
		.sidebar-header-actions{display:flex;align-items:center;gap:.25rem;flex-shrink:0}
		.theme-toggle{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:.25rem;line-height:1;flex-shrink:0;transition:color .15s}
		.theme-toggle:hover{color:var(--text-primary)}
		.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:.25rem}
		.theme-icon-sun{display:none}
		.theme-icon-moon{display:inline}
		:root.dark .theme-icon-sun{display:inline}
		:root.dark .theme-icon-moon{display:none}
		.sidebar.collapsed .sidebar-header{padding:.5rem;justify-content:center;gap:.25rem}
		.sidebar-nav{flex:1;padding:.25rem 0;overflow-y:auto}
		.sidebar-group{margin-top:.75rem}
		/* button reset + existing visual styles; cursor:pointer for toggle affordance */
		.sidebar-group-label{padding:.5rem 1.25rem .25rem;font-family:var(--font-mono);font-size:.5625rem;font-weight:600;color:var(--text-label);text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;text-align:left;cursor:pointer}
		/* ── Nav group collapse (click-to-collapse groups, pm7-borrowed transition) ──
		   Caret rotate ported from pm7.css:4845-4848, re-namespaced.
		   Collapse transition (max-height:0→1000px) ported from pm7.css:4849-4856, re-namespaced. */
		.sidebar-group-label::after{content:"▾";font-size:.625rem;color:var(--text-muted);transition:transform .3s ease-in-out;flex-shrink:0}
		.sidebar-group[data-collapsed="true"] .sidebar-group-label::after{transform:rotate(-90deg)}
		.sidebar-group-items{overflow:hidden;transition:max-height .3s ease-in-out,visibility 0s;max-height:1000px;visibility:visible}
		/* delay visibility:hidden until after max-height animation so links leave tab order only once fully hidden */
		.sidebar-group[data-collapsed="true"] .sidebar-group-items{max-height:0;visibility:hidden;transition:max-height .3s ease-in-out,visibility 0s .3s}
		/* hide caret in icon-rail mode (sidebar collapsed) */
		.sidebar.collapsed .sidebar-group-label::after{display:none}
		/* in icon-rail mode group-collapse is meaningless (labels hidden, pointer-events:none); force all groups expanded */
		.sidebar.collapsed .sidebar-group-items{max-height:none;visibility:visible}
		.sidebar-item{display:flex;align-items:center;gap:.625rem;padding:.4375rem 1.25rem;color:var(--text-secondary);text-decoration:none;font-size:.8125rem;font-weight:500;border-left:2px solid transparent;transition:color .15s,background-color .15s,border-color .15s;white-space:nowrap;cursor:pointer}
		button.sidebar-item{width:100%;font:inherit;background:transparent;color:inherit;border:none;text-align:left}
		.sidebar-item:hover{color:var(--text-primary);background:var(--accent-glow)}
		.sidebar-item.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-glow)}
		.sidebar-icon{font-size:.9375rem;width:1.25rem;text-align:center;flex-shrink:0}
		.sidebar-bottom{margin-top:auto;padding:.5rem 0;border-top:1px solid var(--border-subtle)}
		/* ── Profile block (Phase 7) — sticky-bottom identity (BcryptTOTPAuth) ──
		   Renders above Logout when ChromeState.Profile.Name is non-empty.
		   Collapsed (icon-rail) mode hides name/role via label opacity rule above.
		   Avatar circle: fixed 28px, accent blue, mono initial. */
		.sidebar-profile{display:flex;align-items:center;gap:.625rem;padding:.5rem 1.25rem .25rem;min-width:0}
		.sidebar-profile-avatar{flex-shrink:0;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--accent-dim);color:var(--accent-light);font-family:var(--font-mono);font-size:.6875rem;font-weight:700;display:flex;align-items:center;justify-content:center;text-transform:uppercase;line-height:1}
		.sidebar-profile-info{min-width:0;flex:1}
		.sidebar-profile-name{font-size:.8125rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
		.sidebar-profile-role{font-size:.6875rem;font-family:var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.0625rem}
		.sidebar.collapsed .sidebar-profile-info,.sidebar.collapsed .sidebar-profile{overflow:hidden;opacity:0;height:0;padding:0}
		/* ── Sidebar collapse (icon-rail 220→56px) ────────────────────────────
		   CSS ported from go-nerv internal/admin/templates/layout.html:67-86.
		   cubic-bezier(.4,0,.2,1) = standard material ease-in-out. */
		.sidebar{transition:width .25s cubic-bezier(.4,0,.2,1)}
		.sidebar.collapsed{width:56px}
		.sidebar.collapsed .sidebar-label,
		.sidebar.collapsed .sidebar-group-label,
		.sidebar.collapsed .sidebar-header h1{opacity:0;width:0;overflow:hidden;pointer-events:none}
		.sidebar.collapsed .sidebar-item{justify-content:center;padding-left:0;padding-right:0}
		.sidebar.collapsed .sidebar-icon{width:100%}
		/* ── Nav badge pill (.sidebar-count) ──────────────────────────────────
		   Ported from go-nerv layout.html:85 (re-namespaced sidebar-count).
		   mono .625rem pill, border-radius 9999px, border+bg-elevated surface. */
		.sidebar-count{margin-left:auto;font-family:var(--font-mono);font-size:.625rem;font-weight:600;padding:.0625rem .375rem;border-radius:9999px;border:1px solid var(--border);color:var(--text-secondary);background:var(--bg-elevated)}
		.sidebar.collapsed .sidebar-count{display:none}
		/* ── Collapsed-mode tooltips (.sidebar-tooltip) ───────────────────────
		   Pure CSS, CSP-clean: no JS required. The span is always in the DOM
		   but hidden by default; only revealed on hover when the sidebar is
		   collapsed (icon-rail mode).
		   position:fixed escapes .sidebar{overflow:hidden} — position:absolute
		   is clipped at the 56px collapsed boundary and never renders on screen.
		   CSS anchor positioning (anchor(right)/anchor(top)) positions each fixed
		   tooltip relative to its sidebar-item anchor so it appears flush to the
		   icon's right edge (Chrome 125+/Firefox 133+/Safari 18+).
		   Each <a> carries inline anchor-name:--nav-<id>; each .sidebar-tooltip
		   <span> carries position-anchor:--nav-<id> referencing it. */
		.sidebar-tooltip{display:none}
		.sidebar.collapsed .sidebar-item:hover .sidebar-tooltip{display:block;position:fixed;left:anchor(right);top:anchor(top);padding:.25rem .625rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:.75rem;font-weight:500;white-space:nowrap;pointer-events:none;z-index:100}
		#content{padding:1.5rem 2rem 2rem}
		.htmx-indicator{display:none}
		.htmx-request .htmx-indicator{display:inline-block}
		.crm-th-sort{display:inline-flex;align-items:center;gap:.25rem;color:var(--text-secondary);text-decoration:none;transition:color .12s}
		.crm-th-sort:hover,.crm-th-sort.active{color:var(--text-primary)}
		/* Notice — page-level message block (components/notice.templ). Full border +
		   tinted background rather than a coloured left stripe: the stripe carries
		   nothing to a screen reader and reads as an accident at narrow widths. */
		.notice{padding:.625rem .875rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-surface);color:var(--text-secondary);font-size:.8125rem;line-height:1.5;margin:1rem 0}
		.notice strong{color:var(--text-primary);font-weight:600}
		.notice-info{border-color:var(--accent-dim);background:var(--accent-glow)}
		.notice-warn{border-color:var(--yellow-dim);background:rgba(245,158,11,.08);color:#fcd34d}
		.notice-warn strong{color:#fde68a}
		.notice-danger{border-color:var(--red-dim);background:rgba(239,68,68,.08);color:#fca5a5}
		.notice-danger strong{color:#fecaca}
		.notice-muted{border-color:var(--border-subtle);background:transparent;color:var(--text-muted);font-size:.75rem}
		.badge{display:inline-flex;align-items:center;padding:.1875rem .5rem;border-radius:.25rem;font-family:var(--font-mono);font-size:.6875rem;font-weight:500;letter-spacing:.02em;white-space:nowrap;background:var(--bg-elevated);color:var(--text-secondary)}
		.badge-blue{background:var(--accent-dim);color:var(--accent-light)}
		.badge-green{background:var(--green-dim);color:var(--green-light)}
		.badge-red{background:var(--red-dim);color:var(--red-light)}
		.badge-gray{background:var(--bg-elevated);color:var(--badge-gray-fg);border:1px solid var(--border-subtle)}
		.badge-orange{background:var(--orange-dim);color:var(--orange-light)}
		.badge-purple{background:var(--purple-dim);color:var(--purple-light)}
		.badge-yellow{background:var(--yellow-dim);color:var(--yellow-light)}
		/* A resource with many columns produces a table wider than the
		   viewport — the header row alone sets a floor, because every th is
		   white-space:nowrap and cannot wrap. Without a scroll container that
		   width propagates to the document and the WHOLE PAGE scrolls
		   sideways, carrying the sidebar and header off-screen with it.
		   Measured on go-grad /admin/leads: 14 columns, page scrolled.
		   The container keeps the overflow inside the table's own box.
		   Note overflow-x:auto computes overflow-y to auto as well; the table
		   has nothing that overflows vertically, so nothing is clipped. */
		.crm-table-scroll{overflow-x:auto}
		/* Delete-with-undo. The deleted row keeps the table's rhythm — same
		   height, same borders — so the rows below do not jump while the undo
		   window is open; only the ink changes. */
		.row-delete{background:none;border:none;padding:0 0 0 .75rem;cursor:pointer;
			font-family:inherit;font-size:.75rem;color:var(--text-muted)}
		.row-delete:hover{color:var(--red)}
		.crm-table tbody tr.row-deleted{cursor:default;background:var(--bg-deep)}
		.crm-table tbody tr.row-deleted:hover>td{background:var(--bg-deep)}
		.row-deleted-label{color:var(--text-muted);font-style:italic}
		.row-undo{background:none;border:1px solid var(--border);border-radius:var(--radius);

		.crm-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}

		   into account when the browser computes the table's min-content
		   width, so a long unbreakable token stops widening its column
		   instead of merely being allowed to break once the width is set.
		   Measured on go-grad /admin/leads: a 90-character page URL. */
		.crm-table td{padding:.625rem 1rem;border-bottom:1px solid var(--border-subtle);vertical-align:middle;overflow-wrap:anywhere}

		   The base .crm-table sets cursor:pointer and an accent-tinted row hover
		   because LIST rows link to a detail page. A detail-table row that does
		   nothing but display data inherits both, and a pointer cursor on a row
		   that does nothing is a lie the operator only discovers by clicking it.
		   The hover tint on a non-interactive row is the same lie, quieter. */
		.crm-table--static tbody tr{cursor:default}
		.crm-table--static tbody tr:hover>td{background:transparent}
		/* ── A table inside a card does not draw a card ──────────────────
		   .crm-table paints --bg-surface, a 1px --border and --radius-lg. So
		   does .detail-section. So does .pm7-card. Nest one in the other and
		   the page gets two outlines a few pixels apart on an identical
		   background: the inner line reads as a rendering artefact, not a
		   boundary, and only the containers that happen to hold a table get
		   it, so they look heavier than their neighbours for no reason a
		   reader could name.

		   The condition is STRUCTURAL — "am I already inside something that
		   drew the card" — so the selector is, too. It deliberately does NOT
		   hang off .crm-table--static: that modifier means "these rows do not
		   navigate", which is a different question, and a consumer dropping a
		   plain .crm-table into a .pm7-card (a dashboard summary, a cabinet

		   having done nothing wrong.

		   containers are named. A third one has to be added here — which is

		   is set, so an underline is the whole separation needed and the table
