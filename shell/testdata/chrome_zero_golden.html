<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>T</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23141414'/><text x='6' y='22' font-size='18' fill='%234daafc'>⚙</text></svg>"><link rel="stylesheet" href="/admin/static/pm7.css"><style>
		/* ── Fleet admin canon v2.1 (graphite) — see DESIGN.md ──────────────
		   Two palettes, one vocabulary. Bare :root is graphite LIGHT (VS Code
		   Light Modern family), :root.dark is graphite DARK (VS Code Dark
		   Modern, canon v2.1 verbatim). The theme is the sb-t cookie, not the
		   OS: Layout emits class="dark" unless the cookie says light.

		   Canon names: --bg-deep/-base/-raised/-elevated, --border(-subtle),
		   --text-primary/-secondary/-faint, --accent/-text/-soft and the
		   status pairs --positive/--warning/--negative/--info/--special/
		   --neutral with their -bg. Legacy v1 names (--bg-surface, --text-muted,
		   --text-label, --accent-link, --accent-glow, --accent-dim, --green*,
		   --red*, --yellow*, --orange*, --purple*, --teal*, --fit-*, --suc-*)
		   stay defined and resolve onto the canon values.

		   Every load-bearing text/background pair is held to 4.5:1 by
		   resource/theme_canon_test.go, which parses this block. --text-faint
		   is decorative only (never on text that carries meaning).

		   pm7.css ships its own prefers-color-scheme dark block; both blocks
		   below therefore define every --pm7-* token they need so the cookie
		   wins over the OS preference. */
		:root{
			--bg-deep:#f3f3f3;
			--bg-base:#f8f8f8;
			--bg-raised:#ffffff;
			--bg-elevated:#ececec;
			--border:#d4d4d4;
			--border-subtle:#e5e5e5;
			--border-control:#858585;
			--track:#c8c8c8;
			--text-primary:#242424;
			--text-secondary:#595959;
			--text-faint:#8a8a8a;
			--accent:#005fb8;
			--accent-text:#005fb8;
			--accent-soft:#d6e6f7;
			--positive:#0b6a3a;--positive-bg:#d9f2e3;
			--warning:#7a4a00;--warning-bg:#fbecc8;
			--negative:#a3231a;--negative-bg:#fbe3e0;
			--info:#005fb8;--info-bg:#dbe9f8;
			--special:#944000;--special-bg:#fbe5d2;
			--neutral:#595959;--neutral-bg:#ececec;
			--font-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
			--font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
			--radius:.375rem;
			--radius-lg:.625rem;
			--bg-surface:var(--bg-raised);
			--text-muted:var(--text-secondary);
			--text-label:var(--text-secondary);
			--accent-link:var(--accent-text);
			--accent-glow:rgba(0,95,184,.08);
			--accent-dim:var(--accent-soft);
			--accent-light:var(--accent-text);
			--green:var(--positive);--green-dim:var(--positive-bg);--green-light:var(--positive);
			--yellow:var(--warning);--yellow-dim:var(--warning-bg);--yellow-light:var(--warning);
			--red:var(--negative);--red-dim:var(--negative-bg);--red-light:var(--negative);
			--purple:var(--special);--purple-dim:var(--special-bg);--purple-light:var(--special);
			--teal:var(--info);--teal-dim:var(--info-bg);
			--orange:var(--special);--orange-dim:var(--special-bg);--orange-light:var(--special);
			--btn-primary-bg:var(--accent);
			--btn-primary-hover:#00539f;
			--btn-danger-bg:#b91c1c;
			--btn-danger-hover:#991b1b;
			--badge-gray-fg:var(--neutral);
			--row-hover-bg:var(--bg-elevated);
			--overlay-bg:rgba(0,0,0,.4);
			--fit-strong-bg:var(--positive-bg);--fit-strong-fg:var(--positive);
			--fit-moderate-bg:var(--warning-bg);--fit-moderate-fg:var(--warning);
			--fit-weak-bg:var(--special-bg);--fit-weak-fg:var(--special);
			--fit-low-bg:var(--negative-bg);--fit-low-fg:var(--negative);
			--fit-reject-bg:var(--neutral-bg);--fit-reject-fg:var(--neutral);
			--fit-unscored-bg:var(--neutral-bg);--fit-unscored-fg:var(--neutral);
			--suc-strong-bg:var(--info-bg);--suc-strong-fg:var(--info);
			--suc-moderate-bg:var(--neutral-bg);--suc-moderate-fg:var(--neutral);
			--suc-longshot-bg:var(--neutral-bg);--suc-longshot-fg:var(--neutral);
			--ou-over-fg:var(--special);
			--ou-under-fg:var(--negative);
			--pm7-primary:#005fb8;
			--pm7-primary-hover:#00539f;
			--pm7-primary-active:#004a8f;
			--pm7-primary-foreground:#ffffff;
			--pm7-background:#f8f8f8;
			--pm7-foreground:#242424;
			--pm7-muted:#ececec;
			--pm7-muted-foreground:#595959;
			--pm7-border:#d4d4d4;
			--pm7-border-hover:#b8b8b8;
			--pm7-success:#0b6a3a;
			--pm7-warning:#7a4a00;
			--pm7-error:#a3231a;
			--pm7-radius:.625rem;
			--pm7-surface:var(--bg-raised);
			--pm7-surface-hover:var(--bg-elevated);
			--pm7-surface-active:var(--bg-elevated);
			--pm7-text-primary:var(--pm7-foreground);
			--pm7-text-secondary:var(--pm7-muted-foreground);
			--pm7-menu-bg:var(--pm7-surface);
			--pm7-ring-offset:#ffffff;
			--pm7-input:#ffffff;
			--pm7-card-footer-bg:#f8f8f8;
			--pm7-sidebar-bg:#f3f3f3;
			--pm7-sidebar-item-hover:#ffffff;
			--pm7-header-bg:var(--pm7-surface);
			--pm7-footer-bg:#f3f3f3;
			--pm7-footer-text:var(--pm7-text-secondary);
			--pm7-tooltip-bg:#242424;
			--pm7-tooltip-color:#ffffff;
			--pm7-success-light:#d9f2e3;
			--pm7-success-dark:#0b6a3a;
			--pm7-warning-light:#fbecc8;
			--pm7-warning-dark:#7a4a00;
			--pm7-info-light:#dbe9f8;
			--pm7-info-dark:#005fb8;
			--pm7-theme-switch-bg:var(--pm7-background);
			--pm7-theme-switch-thumb-bg-light:#FFD43B;
			--pm7-theme-switch-thumb-bg-dark:#6E6E6E;
			--pm7-theme-switch-icon-light:var(--pm7-foreground);
			--pm7-theme-switch-icon-dark:var(--pm7-background);
			--pm7-theme-switch-sun-color:#FFB800;
			--pm7-theme-switch-moon-color:#4A5568;
			--pm7-menu-hover-shadow:rgba(0,0,0,.08) 0px 5px 15px 0px,rgba(25,28,33,.2) 0px 15px 35px -5px;
			--pm7-focus-shadow:0 0 0 3px rgb(0 95 184 / 0.2);
			--pm7-shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.05);
			--pm7-shadow:0 1px 3px 0 rgb(0 0 0 / 0.1),0 1px 2px -1px rgb(0 0 0 / 0.1);
			--pm7-shadow-md:0 4px 6px -1px rgb(0 0 0 / 0.1),0 2px 4px -2px rgb(0 0 0 / 0.1);
			--pm7-shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1),0 4px 6px -4px rgb(0 0 0 / 0.1);
			--pm7-shadow-xl:0 20px 25px -5px rgb(0 0 0 / 0.1),0 8px 10px -6px rgb(0 0 0 / 0.1);
			--pm7-shadow-2xl:0 25px 50px -12px rgb(0 0 0 / 0.25);
		}
		/* ── Dark palette: canon v2.1, selected by .dark on <html> ───────── */

			--bg-deep:#141414;
			--bg-base:#181818;
			--bg-raised:#1f1f1f;
			--bg-elevated:#282828;
			--border:#2b2b2b;

			--positive:#52d99a;--positive-bg:#113327;

			--info:#4daafc;--info-bg:#0f2c44;
			--special:#f0a15c;--special-bg:#38220f;

			--pm7-primary-foreground:#ffffff;

			--pm7-muted-foreground:#9a9a9a;

			--pm7-success:#52d99a;

		*{margin:0;padding:0;box-sizing:border-box}
		body{background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-sans);min-height:100vh;font-size:.9375rem;line-height:1.5}
		::selection{background:var(--accent);color:#fff}
		a{color:var(--accent-text);text-decoration:none}
		a:hover{opacity:.85}
		/* One focus treatment for every interactive element (canon: 2px accent ring, offset 2px). */
		a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible,.filter-chip:focus-visible,.sidebar-item:focus-visible,.crm-th-sort:focus-visible,a.badge:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
		.app{display:flex;min-height:100vh}
		.main{flex:1;min-width:0;overflow-x:auto;background:var(--bg-base)}
		.sidebar{width:220px;background:var(--bg-deep);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;position:sticky;top:0;height:100vh;align-self:flex-start}
		.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;min-height:56px}
		.sidebar-header h1{font-family:var(--font-mono);font-size:.8125rem;font-weight:600;color:var(--accent-text);letter-spacing:.02em;white-space:nowrap;overflow:hidden}
		.sidebar-toggle{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.125rem;padding:.25rem;line-height:1;flex-shrink:0;transition:color .15s}
		.sidebar-toggle:hover{color:var(--text-primary)}
		.sidebar-header-actions{display:flex;align-items:center;gap:.25rem;flex-shrink:0}
		.theme-toggle{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:.25rem;line-height:1;flex-shrink:0;transition:color .15s}
		.theme-toggle:hover{color:var(--text-primary)}
		.theme-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:.25rem}
		.theme-icon-sun{display:none}
		.theme-icon-moon{display:inline}
		:root.dark .theme-icon-sun{display:inline}
		:root.dark .theme-icon-moon{display:none}
		.sidebar.collapsed .sidebar-header{padding:.5rem;justify-content:center;gap:.25rem}
		.sidebar-nav{flex:1;padding:.25rem 0;overflow-y:auto}
		.sidebar-group{margin-top:.75rem}
		/* button reset + existing visual styles; cursor:pointer for toggle affordance */
		.sidebar-group-label{padding:.5rem 1.25rem .25rem;font-family:var(--font-mono);font-size:.6875rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;text-align:left;cursor:pointer}
		/* ── Nav group collapse (click-to-collapse groups, pm7-borrowed transition) ──
		   Caret rotate ported from pm7.css:4845-4848, re-namespaced.
		   Collapse transition (max-height:0→1000px) ported from pm7.css:4849-4856, re-namespaced. */
		.sidebar-group-label::after{content:"▾";font-size:.6875rem;color:var(--text-secondary);transition:transform .3s ease-in-out;flex-shrink:0}
		.sidebar-group[data-collapsed="true"] .sidebar-group-label::after{transform:rotate(-90deg)}
		.sidebar-group-items{overflow:hidden;transition:max-height .3s ease-in-out,visibility 0s;max-height:1000px;visibility:visible}
		/* delay visibility:hidden until after max-height animation so links leave tab order only once fully hidden */
		.sidebar-group[data-collapsed="true"] .sidebar-group-items{max-height:0;visibility:hidden;transition:max-height .3s ease-in-out,visibility 0s .3s}
		/* hide caret in icon-rail mode (sidebar collapsed) */
		.sidebar.collapsed .sidebar-group-label::after{display:none}
		/* in icon-rail mode group-collapse is meaningless (labels hidden, pointer-events:none); force all groups expanded */
		.sidebar.collapsed .sidebar-group-items{max-height:none;visibility:visible}
		.sidebar-item{display:flex;align-items:center;gap:.625rem;padding:.4375rem 1.25rem;color:var(--text-secondary);text-decoration:none;font-size:.8125rem;font-weight:500;border-left:2px solid transparent;transition:color .15s,background-color .15s,border-color .15s;white-space:nowrap;cursor:pointer}
		button.sidebar-item{width:100%;font:inherit;font-size:.8125rem;font-weight:500;background:transparent;color:inherit;border:none;text-align:left}
		.sidebar-item:hover{color:var(--text-primary);background:var(--accent-glow)}
		.sidebar-item.active{color:var(--accent-text);border-left-color:var(--accent);background:var(--accent-glow)}
		.sidebar-icon{font-size:.9375rem;width:1.25rem;text-align:center;flex-shrink:0}
		.sidebar-bottom{margin-top:auto;padding:.5rem 0;border-top:1px solid var(--border-subtle)}
		/* ── Profile block (Phase 7) — sticky-bottom identity (BcryptTOTPAuth) ──
		   Renders above Logout when ChromeState.Profile.Name is non-empty.
		   Collapsed (icon-rail) mode hides name/role via label opacity rule above.
		   Avatar circle: fixed 28px, accent blue, mono initial. */
		.sidebar-profile{display:flex;align-items:center;gap:.625rem;padding:.5rem 1.25rem .25rem;min-width:0}
		.sidebar-profile-avatar{flex-shrink:0;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-family:var(--font-mono);font-size:.6875rem;font-weight:700;display:flex;align-items:center;justify-content:center;text-transform:uppercase;line-height:1}
		.sidebar-profile-info{min-width:0;flex:1}
		.sidebar-profile-name{font-size:.8125rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
		.sidebar-profile-role{font-size:.6875rem;font-family:var(--font-mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.0625rem}
		.sidebar.collapsed .sidebar-profile-info,.sidebar.collapsed .sidebar-profile{overflow:hidden;opacity:0;height:0;padding:0}
		/* ── Sidebar collapse (icon-rail 220→56px) ────────────────────────────
		   CSS ported from go-nerv internal/admin/templates/layout.html:67-86.
		   cubic-bezier(.4,0,.2,1) = standard material ease-in-out. */
		.sidebar{transition:width .25s cubic-bezier(.4,0,.2,1)}
		.sidebar.collapsed{width:56px}
		.sidebar.collapsed .sidebar-label,
		.sidebar.collapsed .sidebar-group-label,
		.sidebar.collapsed .sidebar-header h1{opacity:0;width:0;overflow:hidden;pointer-events:none}
		.sidebar.collapsed .sidebar-item{justify-content:center;padding-left:0;padding-right:0}
		.sidebar.collapsed .sidebar-icon{width:100%}
		/* ── Nav badge pill (.sidebar-count) ──────────────────────────────────
		   Ported from go-nerv layout.html:85 (re-namespaced sidebar-count).
		   mono .625rem pill, border-radius 9999px, border+bg-elevated surface. */
		.sidebar-count{margin-left:auto;font-family:var(--font-mono);font-size:.6875rem;font-weight:600;padding:.0625rem .375rem;border-radius:9999px;border:1px solid var(--border);color:var(--text-secondary);background:var(--bg-elevated)}
		.sidebar.collapsed .sidebar-count{display:none}
		/* ── Collapsed-mode tooltips (.sidebar-tooltip) ───────────────────────
		   Pure CSS, CSP-clean: no JS required. The span is always in the DOM
		   but hidden by default; only revealed on hover when the sidebar is
		   collapsed (icon-rail mode).
		   position:fixed escapes .sidebar{overflow:hidden} — position:absolute
		   is clipped at the 56px collapsed boundary and never renders on screen.
		   CSS anchor positioning (anchor(right)/anchor(top)) positions each fixed
		   tooltip relative to its sidebar-item anchor so it appears flush to the
		   icon's right edge (Chrome 125+/Firefox 133+/Safari 18+).
		   Each <a> carries inline anchor-name:--nav-<id>; each .sidebar-tooltip
		   <span> carries position-anchor:--nav-<id> referencing it. */
		.sidebar-tooltip{display:none}
		.sidebar.collapsed .sidebar-item:hover .sidebar-tooltip{display:block;position:fixed;left:anchor(right);top:anchor(top);padding:.25rem .625rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-primary);font-size:.75rem;font-weight:500;white-space:nowrap;pointer-events:none;z-index:100}
		#content{padding:1.5rem 2rem 2.5rem;max-width:87.5rem;margin:0 auto}
		/* Tables may use the full 1400px; detail grids, prose and forms stay at the canon 1200px. */
		.detail-items,.page-header,.market-reasoning{max-width:75rem}
		.htmx-indicator{display:none}
		.htmx-request .htmx-indicator{display:inline-block}
		.crm-th-sort{display:inline-flex;align-items:center;gap:.25rem;color:var(--text-secondary);text-decoration:none;transition:color .12s}
		.crm-th-sort:hover,.crm-th-sort.active{color:var(--text-primary)}
		/* Notice — page-level message block (components/notice.templ). Full border +
		   tinted background rather than a coloured left stripe: the stripe carries
		   nothing to a screen reader and reads as an accident at narrow widths. */
		.notice{padding:.75rem 1rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-raised);color:var(--text-secondary);font-size:.8125rem;line-height:1.5;margin:1rem 0}
		.notice strong{color:var(--text-primary);font-weight:600}
		/* Status variants: solid dim background + bright text of the SAME hue (canon status pair),
		   border mixed from the two so it reads as an outline of the pair, never a bright stripe. */
		.notice-info{background:var(--info-bg);color:var(--info);border-color:color-mix(in srgb,var(--info) 40%,var(--info-bg))}
		.notice-warn{background:var(--warning-bg);color:var(--warning);border-color:color-mix(in srgb,var(--warning) 40%,var(--warning-bg))}
		.notice-danger{background:var(--negative-bg);color:var(--negative);border-color:color-mix(in srgb,var(--negative) 40%,var(--negative-bg))}
		.notice-info strong,.notice-warn strong,.notice-danger strong{color:inherit}
		.notice-muted{border-color:var(--border-subtle);background:transparent;color:var(--text-secondary);font-size:.75rem}
		.badge{display:inline-flex;align-items:center;padding:.125rem .5rem;border:1px solid transparent;border-radius:var(--radius);font-family:var(--font-mono);font-size:.75rem;font-weight:500;line-height:1.4;letter-spacing:.02em;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral);border-color:var(--border)}
		/* Canon status pairs: solid dim background + bright text of the same hue. The legacy
		   colour class names are kept and mapped onto the roles; the role names are aliases. */
		.badge-blue,.badge-info{background:var(--info-bg);color:var(--info);border-color:transparent}
		.badge-green,.badge-positive{background:var(--positive-bg);color:var(--positive);border-color:transparent}
		.badge-red,.badge-negative{background:var(--negative-bg);color:var(--negative);border-color:transparent}
		.badge-yellow,.badge-warning{background:var(--warning-bg);color:var(--warning);border-color:transparent}
		.badge-orange,.badge-purple,.badge-special{background:var(--special-bg);color:var(--special);border-color:transparent}
		.badge-gray,.badge-neutral{background:var(--neutral-bg);color:var(--neutral);border-color:var(--border)}
		/* A resource with many columns produces a table wider than the
		   viewport — the header row alone sets a floor, because every th is
		   white-space:nowrap and cannot wrap. Without a scroll container that
		   width propagates to the document and the WHOLE PAGE scrolls
		   sideways, carrying the sidebar and header off-screen with it.
		   Measured on go-grad /admin/leads: 14 columns, page scrolled.
		   The container keeps the overflow inside the table's own box.
		   Note overflow-x:auto computes overflow-y to auto as well; the table
		   has nothing that overflows vertically, so nothing is clipped. */
		.crm-table-scroll{overflow-x:auto}
		/* Delete-with-undo. The deleted row keeps the table's rhythm — same
		   height, same borders — so the rows below do not jump while the undo
		   window is open; only the ink changes. */
		.row-delete{background:none;border:none;padding:0 0 0 .75rem;cursor:pointer;
			font-family:inherit;font-size:.75rem;color:var(--text-muted)}
		.row-delete:hover{color:var(--negative)}
		.crm-table tbody tr.row-deleted{cursor:default;background:var(--bg-deep)}
		.crm-table tbody tr.row-deleted:hover>td{background:var(--bg-deep)}
		.row-deleted-label{color:var(--text-muted);font-style:italic}
		.row-undo{background:none;border:1px solid var(--border);border-radius:var(--radius);
			padding:.2rem .6rem;cursor:pointer;font-family:inherit;font-size:.75rem;
			color:var(--accent-link)}
		.row-undo:hover{border-color:var(--accent)}
		.undo-toast{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;
			padding:.6rem .9rem;background:var(--bg-raised);border:1px solid var(--border);
			border-radius:var(--radius-lg);color:var(--text-secondary);font-size:.8125rem}
		.undo-toast form{margin:0}
		/* A trash section whose lister failed. Loud on purpose: the alternative
		   is a section that renders as empty, which is the same picture as "you
		   deleted nothing here" — and the row the operator came to recover is
		   exactly the one they would then stop looking for. */
		.trash-unreadable{padding:.6rem .9rem;border:1px solid var(--negative);
			border-radius:var(--radius);color:var(--negative);font-size:.8125rem}
		/* The fade is the only motion: prefers-reduced-motion callers get the
		   removal without it, which is still correct. */
		.undo-expired{opacity:0;transition:opacity .18s ease-out}
		@media (prefers-reduced-motion: reduce){.undo-expired{transition:none}}
		.crm-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
		.crm-table thead th{text-align:left;padding:.5rem 1rem;color:var(--text-secondary);font-family:var(--font-mono);font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);background:var(--bg-deep);white-space:nowrap}
		.crm-table thead th:first-child{padding-left:1.25rem}
		.crm-table tbody tr{cursor:pointer;transition:background .08s}
		.crm-table tbody tr:hover>td{background:var(--row-hover-bg)}
		.crm-table tbody tr:hover .row-name{color:var(--accent-text)}
		/* overflow-wrap:anywhere, not break-word: only `anywhere` is taken
		   into account when the browser computes the table's min-content
		   width, so a long unbreakable token stops widening its column
		   instead of merely being allowed to break once the width is set.
		   Measured on go-grad /admin/leads: a 90-character page URL. */
		.crm-table td{padding:.75rem 1rem;border-bottom:1px solid var(--border-subtle);vertical-align:middle;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
		.crm-table td:first-child{padding-left:1.25rem}
		.crm-table tbody tr:last-child td{border-bottom:none}
		.crm-table a{color:var(--text-primary);text-decoration:none}
		.crm-table a:hover{color:var(--accent-text)}
		/* .crm-table--static — a detail-page table whose rows do NOT navigate.
		   The base .crm-table sets cursor:pointer and an accent-tinted row hover
		   because LIST rows link to a detail page. A detail-table row that does
		   nothing but display data inherits both, and a pointer cursor on a row
		   that does nothing is a lie the operator only discovers by clicking it.
		   The hover tint on a non-interactive row is the same lie, quieter. */
		.crm-table--static tbody tr{cursor:default}
		.crm-table--static tbody tr:hover>td{background:transparent}
		/* ── A table inside a card does not draw a card ──────────────────
		   .crm-table paints --bg-surface, a 1px --border and --radius-lg. So
		   does .detail-section. So does .pm7-card. Nest one in the other and
		   the page gets two outlines a few pixels apart on an identical
		   background: the inner line reads as a rendering artefact, not a
		   boundary, and only the containers that happen to hold a table get
		   it, so they look heavier than their neighbours for no reason a
		   reader could name.

		   The condition is STRUCTURAL — "am I already inside something that
		   drew the card" — so the selector is, too. It deliberately does NOT
		   hang off .crm-table--static: that modifier means "these rows do not
		   navigate", which is a different question, and a consumer dropping a
		   plain .crm-table into a .pm7-card (a dashboard summary, a cabinet
		   overview, a billing preview) would keep the doubled frame while
		   having done nothing wrong.

		   CSS cannot say "any ancestor that draws a border", so the two card
		   containers are named. A third one has to be added here — which is
		   the trade for not asking every consumer to remember a modifier.

		   Keep prose out of this file's identifiers: styles.templ is inlined
		   into every page, and resource/nav_filter_test.go asserts nav labels
		   are ABSENT with strings.Contains over the WHOLE body. A comment that
		   happens to name a resource fails it. */
		.detail-section .crm-table,.pm7-card .crm-table{background:transparent;border:0;border-radius:0}
		.detail-section .crm-table td:first-child,.detail-section .crm-table thead th:first-child,.pm7-card .crm-table td:first-child,.pm7-card .crm-table thead th:first-child{padding-left:0}
		.detail-section .crm-table td:last-child,.detail-section .crm-table thead th:last-child,.pm7-card .crm-table td:last-child,.pm7-card .crm-table thead th:last-child{padding-right:0}
		.detail-section .crm-table tbody tr:last-child>td,.pm7-card .crm-table tbody tr:last-child>td{border-bottom:0}
		/* The header strip goes too. --bg-deep behind a thead reads as a bar
		   once the table has no frame to clip it; the columns are already
		   mono/uppercase/--text-muted, which is exactly how .detail-item-label
		   is set, so an underline is the whole separation needed and the table
		   header stops looking like a different component. */
		.detail-section .crm-table thead th,.pm7-card .crm-table thead th{background:transparent}
		/* A section can carry Items AND a Table. Without this the thead sits
		   directly against the last label-value row. */
		.detail-items+.crm-table-scroll{margin-top:.75rem}
		.row-name{font-weight:600;font-size:.9375rem;color:var(--text-primary);transition:color .1s}
		.row-sub{font-size:.8125rem;line-height:1.45;color:var(--text-secondary);margin-top:.125rem;display:block}
		.page-header{margin-bottom:1.5rem}
		.page-header h2{font-size:1.375rem;line-height:1.2;letter-spacing:-.012em;font-weight:650;color:var(--text-primary);margin-bottom:.25rem}
		.page-header p{color:var(--text-secondary);font-size:.8125rem;line-height:1.45}
		.filter-bar{display:flex;gap:.5rem;align-items:center;margin-bottom:1.25rem;flex-wrap:wrap;padding:.5rem .75rem;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius);font-size:.75rem}
		.filter-chip{padding:.1875rem .625rem;border:1px solid var(--border-control);border-radius:9999px;font-size:.75rem;font-weight:500;color:var(--text-secondary);background:transparent;cursor:pointer;transition:color .12s,background-color .12s,border-color .12s;text-decoration:none;display:inline-block}
		.filter-chip:hover{color:var(--text-primary);border-color:var(--text-faint)}
		.filter-chip.active{color:var(--accent-text);background:var(--accent-soft);border-color:var(--accent)}
		.pagination{display:flex;gap:.5rem;justify-content:center;margin-top:1.25rem}
		.sidebar .pm7-sidebar-item--active{border-left-color:var(--accent);background:var(--accent-glow)}
		/* ── Nav parent-item submenu (Phase 5, one level) ─────────────────────
		   Caret mirrors Phase 4 group collapse pattern (re-namespaced).
		   .sidebar-parent wraps parent navLink + .sidebar-children; default expanded.
		   JS (sb-s cookie) controls collapse; active-child guard blocks collapse.
		   Parent link click in JS toggles submenu (preventDefault navigation). */
		.sidebar-parent > .sidebar-item::after{content:"▾";font-size:.6875rem;color:var(--text-secondary);transition:transform .3s ease-in-out;margin-left:auto;flex-shrink:0}
		.sidebar-parent[data-collapsed="true"] > .sidebar-item::after{transform:rotate(-90deg)}
		.sidebar-children{overflow:hidden;transition:max-height .3s ease-in-out,visibility 0s;max-height:1000px;visibility:visible}
		.sidebar-parent[data-collapsed="true"] .sidebar-children{max-height:0;visibility:hidden;transition:max-height .3s ease-in-out,visibility 0s .3s}
		.sidebar-children .sidebar-item{padding-left:2.5rem}
		/* hide caret in icon-rail mode (sidebar collapsed) */
		.sidebar.collapsed .sidebar-parent > .sidebar-item::after{display:none}
		/* in icon-rail mode force all submenus expanded (mirrors Phase 4 group behaviour) */
		.sidebar.collapsed .sidebar-children{max-height:none;visibility:visible}
		/* ── Fit axis chips ───────────────────────────────────────────────── */
		/* Namespaced fit-* to avoid collision with .badge-* (which carry semantic
		   green/red for system success/error — orthogonal to job-fit). */
		.fit-chip{display:inline-flex;align-items:center;gap:.3125rem;padding:.1875rem .4375rem;border-radius:.25rem;font-family:var(--font-mono);font-size:.6875rem;font-weight:600;white-space:nowrap;line-height:1}
		.fit-num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
		.fit-label{font-weight:400;font-size:.6875rem;letter-spacing:.03em}
		.fit-strong{background:var(--fit-strong-bg);color:var(--fit-strong-fg)}
		.fit-moderate{background:var(--fit-moderate-bg);color:var(--fit-moderate-fg)}
		.fit-weak{background:var(--fit-weak-bg);color:var(--fit-weak-fg)}
		.fit-low{background:var(--fit-low-bg);color:var(--fit-low-fg)}
		.fit-reject{background:var(--fit-reject-bg);color:var(--fit-reject-fg)}
		.fit-unscored{background:var(--fit-unscored-bg);color:var(--fit-unscored-fg);font-style:italic}
		/* ── Success / Market Read chips ──────────────────────────────────── */
		/* Diamond family (blue/neutral; violet is retired) — orthogonal to fit-* by shape + glyph.
		   Shape (◆/◇/◈) communicates band without color dependency (a11y). */
		.suc-chip{display:inline-flex;align-items:center;gap:.25rem;padding:.1875rem .4375rem;border-radius:.25rem;font-family:var(--font-mono);font-size:.6875rem;font-weight:500;white-space:nowrap;line-height:1}
		.suc-strong{background:var(--suc-strong-bg);color:var(--suc-strong-fg)}
		.suc-moderate{background:var(--suc-moderate-bg);color:var(--suc-moderate-fg)}
		.suc-longshot{background:var(--suc-longshot-bg);color:var(--suc-longshot-fg);outline:1px dashed var(--border);outline-offset:-1px}
		.suc-none{color:var(--text-secondary)}
		/* ── Over/under qualification glyphs ──────────────────────────────── */
		.ou-glyph{font-family:var(--font-mono);font-size:.75rem;font-weight:700}
		.ou-over{color:var(--ou-over-fg)}
		.ou-match{color:var(--text-muted)}
		.ou-under{color:var(--ou-under-fg)}
		/* ── Detail page layout ────────────────────────────────────────────── */
		/* Canon detail page: no card per section. Structure = section title + content,
		   40px between sections, field grid of micro label over body value. */
		.detail-page{display:flex;flex-direction:column;gap:2.5rem}
		.detail-section{background:transparent;border:0;border-radius:0;padding:0}
		.detail-section-title{font-size:1.0625rem;line-height:1.35;font-weight:600;color:var(--text-primary);margin-bottom:.75rem}
		.detail-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem 1.5rem}
		.detail-item{display:flex;flex-direction:column;gap:.25rem;min-width:0}
		.detail-item-label{font-family:var(--font-mono);font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
		.detail-item-value{font-size:.9375rem;color:var(--text-primary);line-height:1.5;overflow-wrap:anywhere}
		/* ── Detail view: fit card panels (consumer-supplied via RawHTML) ─── */
		.fit-card{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;margin-bottom:.75rem}
		.fit-card-header{font-family:var(--font-mono);font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:.75rem}
		.fit-card-cols{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
		.fit-col-label{font-size:.6875rem;font-family:var(--font-mono);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);margin-bottom:.375rem}
		.fit-col-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.3125rem}
		.fit-col-list li{font-size:.8125rem;color:var(--text-secondary);line-height:1.4;padding-left:.875rem;position:relative}
		.fit-col-list li::before{content:"·";position:absolute;left:0;color:var(--text-secondary)}
		/* ── Detail view: market read card (consumer-supplied via RawHTML) ── */
		.market-card{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem}
		.market-card-header{display:flex;align-items:center;gap:.625rem;margin-bottom:.625rem}
		.market-card-label{font-family:var(--font-mono);font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
		.market-reasoning{font-size:.8125rem;color:var(--text-secondary);line-height:1.55;margin-bottom:.625rem;max-width:72ch}
		.market-disclaimer{font-size:.6875rem;color:var(--text-muted);font-family:var(--font-mono);line-height:1.4}
		.market-disclaimer::before{content:"⚠ ";color:var(--text-muted)}
		/* ── Detail view: job header (consumer-supplied via RawHTML) ────────── */
		.job-detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.25rem}
		.job-detail-title{font-size:1.0625rem;font-weight:600;color:var(--text-primary);line-height:1.3}
		.job-detail-meta{font-family:var(--font-mono);font-size:.6875rem;color:var(--text-muted);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
		.job-detail-meta a{color:var(--accent-text);text-decoration:none}
		.job-detail-meta a:hover{opacity:.8}
		/* ── Mobile off-canvas drawer (Phase 6, pm7-borrowed overlay) ─────────
		   Overlay backdrop: pm7.css:4668-4681 (.pm7-sidebar-overlay), re-namespaced.
		   Responsive transform: pm7.css:4731-4748 (.pm7-sidebar--static), inverted to
		   max-width:767px and re-namespaced to .sidebar / .sidebar-overlay.
		   Desktop (≥768px) unchanged — sidebar retains normal flow positioning. */
		.sidebar-overlay{position:fixed;inset:0;background-color:var(--overlay-bg);opacity:0;visibility:hidden;transition:opacity .3s ease-in-out;z-index:999}
		.sidebar-overlay--visible{opacity:1;visibility:visible}
		.sidebar-mobile-toggle{display:none;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.25rem;padding:.5rem .75rem;line-height:1;transition:color .15s}
		.sidebar-mobile-toggle:hover{color:var(--text-primary)}
		@media(max-width:767px){
			.sidebar{position:fixed;top:0;left:0;height:100%;z-index:1000;transform:translateX(-100%);transition:transform .3s ease-in-out}
			.sidebar--open{transform:translateX(0)}
			.sidebar-mobile-toggle{display:block}
		}
		/* ── Stat cards (StatCardView) ─────────────────────────────────────────
		   Ported VERBATIM from oxpulse-admin internal/admin/templates/layout.html:58-62.
		   .stat-grid is a layout helper; individual .stat-card tiles are rendered
		   by components.StatCardView. */
		.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.25rem}
		.stat-card{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
		.stat-label{font-family:var(--font-mono);font-size:.6875rem;font-weight:500;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.375rem}
		.stat-value{font-size:1.75rem;font-weight:700;color:var(--text-primary);font-family:var(--font-mono)}
		/* ── Delta badges (GA4-style period-over-period) ───────────────────────
		   Ported from oxpulse-admin layout.html:81-86; remapped to go-panel tokens.
		   Status pairs are solid canon tokens, never rgba. */
		.delta{display:inline-block;margin-left:.4rem;font-family:var(--font-mono);font-size:.6875rem;font-weight:600;padding:.125rem .4rem;border-radius:999px;vertical-align:middle}
		.delta-up{color:var(--positive);background:var(--positive-bg)}
		.delta-down{color:var(--negative);background:var(--negative-bg)}
		.delta-new{color:var(--info);background:var(--info-bg)}
		.delta-flat{color:var(--neutral);background:var(--neutral-bg)}
		/* ── Sparkline (components.Sparkline) ──────────────────────────────────
		   Ported VERBATIM from oxpulse-admin internal/admin/templates/layout.html:131-133.
		   Server-rendered inline SVG; no JS, no chart library, CSP/ТСПУ-safe.
		   Stroke colours use existing tokens (var(--accent)/var(--border)). */
		.sparkline{vertical-align:middle;display:inline-block}
		.sparkline-line{stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
		.sparkline-zero{stroke:var(--border);stroke-width:1;stroke-dasharray:2,2}
		/* ── Colour scheme + form controls ─────────────────────────────────────
		   pm7.css paints .pm7-input with --pm7-input and --pm7-foreground. The
		   light palette sets --pm7-input:#fff on bare :root; :root.dark did not
		   override it, so in the dark theme a select/input/textarea/datetime-local
		   rendered pale text on a white fill. The dark block now sets --pm7-input,
		   and the rules below pin fill, text and border to go-panel tokens so the
		   control no longer depends on which pm7 token happens to be defined.
		   color-scheme makes the native pieces (datetime picker icon, select
		   popup, scrollbars) follow the cookie theme instead of the OS. */
		:root{color-scheme:light}
		:root.dark{color-scheme:dark}
		input.pm7-input,select.pm7-input,textarea.pm7-input{background-color:var(--pm7-input);color:var(--text-primary);border-color:var(--border-control);border-radius:var(--radius)}
		input.pm7-input::placeholder,textarea.pm7-input::placeholder{color:var(--text-secondary)}
		select.pm7-input{padding-right:2rem;background-image:linear-gradient(45deg,transparent 50%,var(--text-secondary) 50%),linear-gradient(135deg,var(--text-secondary) 50%,transparent 50%);background-position:calc(100% - 1.0625rem) 50%,calc(100% - .75rem) 50%;background-size:.3125rem .3125rem;background-repeat:no-repeat}
		select.pm7-input option{background-color:var(--bg-raised);color:var(--text-primary)}
		input.pm7-input:focus-visible,select.pm7-input:focus-visible,textarea.pm7-input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
		/* ── Tone: one set of custom properties shared by funnel bars, stepper
		   steps and timeline dots. A closed enum (components.Tone) maps to these
		   class names — callers never pass a class string. */
		.tone-neutral,.tone-gray{--tone-bg:var(--neutral-bg);--tone-fg:var(--neutral);--tone-line:var(--text-faint)}
		.tone-blue,.tone-info{--tone-bg:var(--info-bg);--tone-fg:var(--info);--tone-line:var(--accent)}
		.tone-green,.tone-positive{--tone-bg:var(--positive-bg);--tone-fg:var(--positive);--tone-line:var(--positive)}
		.tone-red,.tone-negative{--tone-bg:var(--negative-bg);--tone-fg:var(--negative);--tone-line:var(--negative)}
		.tone-orange,.tone-purple,.tone-special{--tone-bg:var(--special-bg);--tone-fg:var(--special);--tone-line:var(--special)}
		.tone-yellow,.tone-warning{--tone-bg:var(--warning-bg);--tone-fg:var(--warning);--tone-line:var(--warning)}
		/* ── Buttons: .btn + one variant. White text sits on --btn-primary-bg /
		   --btn-danger-bg (>= 4.5:1, asserted by resource/theme_canon_test.go). */
		.btn{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;min-height:2.25rem;padding:.375rem .875rem;border-radius:var(--radius);border:1px solid transparent;background:transparent;color:var(--text-primary);font-family:inherit;font-size:.8125rem;font-weight:600;line-height:1.2;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}
		.btn:hover{opacity:1}
		.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
		.btn-primary{background:var(--btn-primary-bg);color:#fff}
		.btn-primary:hover{background:var(--btn-primary-hover)}
		.btn-secondary{background:transparent;color:var(--text-primary);border-color:var(--border-control)}
		.btn-secondary:hover{background:var(--bg-elevated);border-color:var(--text-faint)}
		.btn-ghost{background:transparent;color:var(--accent-text)}
		.btn-ghost:hover{background:var(--accent-glow)}
		.btn-danger{background:var(--btn-danger-bg);color:#fff}
		.btn-danger:hover{background:var(--btn-danger-hover)}
		.btn-sm{min-height:1.75rem;padding:.1875rem .625rem;font-size:.75rem}
		.btn-lg{min-height:2.75rem;padding:.5rem 1.125rem;font-size:.875rem}
		.btn-block{display:flex;width:100%}
		.btn:disabled,.btn[aria-disabled="true"]{background:var(--bg-elevated);color:var(--text-secondary);border-color:var(--border);cursor:not-allowed;pointer-events:none}
		@media(prefers-reduced-motion:reduce){.btn{transition:none}}
		/* ── Definition list: mono 11px label over a 14px value. */
		.dl-compact{display:flex;flex-direction:column;gap:.75rem;margin:0}
		.dl-compact>div{display:flex;flex-direction:column;gap:.125rem;min-width:0}
		.dl-compact dt{font-family:var(--font-mono);font-size:.6875rem;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary)}
		.dl-compact dd{margin:0;font-size:.9375rem;color:var(--text-primary);overflow-wrap:anywhere}
		/* ── Queue row (components.QueueRow): marker | main | actions. */
		.queue-list{display:flex;flex-direction:column}
		.queue-row{display:grid;grid-template-columns:9.5rem minmax(0,1fr) auto;gap:1rem;align-items:center;min-height:4.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--border-subtle)}
		.queue-row:last-child{border-bottom:0}
		.queue-marker{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;min-width:0}
		.queue-meta{font-size:.75rem;color:var(--text-secondary)}
		.queue-main{min-width:0}
		.queue-title{font-weight:600;font-size:.875rem;color:var(--text-primary)}
		a.queue-title:hover{text-decoration:underline}
		.queue-subtitle{margin-left:.5rem;font-size:.8125rem;color:var(--text-secondary)}

		.queue-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
		.queue-actions form{margin:0}
		/* ── Funnel (components.Funnel): label + count + share, then the bar. */
		.funnel{display:flex;flex-direction:column;gap:.875rem;margin:0;padding:0;list-style:none}
		.funnel-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;font-size:.8125rem;color:var(--text-primary)}
		.funnel-count{font-family:var(--font-mono);font-weight:600}
		.funnel-pct{margin-left:.5rem;font-family:var(--font-mono);font-size:.6875rem;color:var(--text-secondary)}
		.funnel-track{height:.375rem;margin-top:.3125rem;border-radius:9999px;background:var(--track);overflow:hidden}
		.funnel-bar{height:100%;border-radius:9999px;background:var(--tone-line)}
		.funnel-note{margin-top:.75rem;font-size:.75rem;color:var(--text-secondary)}
		/* ── Stepper (components.Stepper): lifecycle steps + a detached terminal step. */
		.stepper{display:flex;align-items:center;gap:0;flex-wrap:wrap;row-gap:.5rem}
		.stepper-item{display:flex;align-items:center}
		.stepper-item+.stepper-item::before{content:"";display:block;width:1rem;height:1px;background:var(--border)}
		.stepper-item form{margin:0}
		.stepper-sep{width:1px;align-self:stretch;min-height:1.75rem;margin:0 .75rem;background:var(--border)}
		.stepper-step{position:relative;display:inline-flex;align-items:center;gap:.375rem;min-height:2.25rem;padding:.375rem .875rem;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-family:inherit;font-size:.8125rem;line-height:1.2;white-space:nowrap}
		button.stepper-step{cursor:pointer}
		button.stepper-step:hover{border-color:var(--text-faint);color:var(--text-primary)}
		button.stepper-step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
		.stepper-step.is-done{color:var(--text-secondary)}
		.stepper-step.is-current{background:var(--tone-bg);color:var(--tone-fg);border-color:var(--tone-line);font-weight:700}
		.stepper-step.is-next{border-color:var(--accent);color:var(--accent-text);font-weight:600}
		.stepper-glyph{font-size:.875rem}
		.stepper-state{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
		.stepper-hint{margin-top:.5rem;font-size:.8125rem;color:var(--text-secondary)}
		/* ── Timeline (components.Timeline): dot + 1px line, caller orders newest first. */
		.timeline{list-style:none;margin:0;padding:0}
		.timeline-item{position:relative;padding:0 0 1rem 1.75rem}
		.timeline-item::before{content:"";position:absolute;left:.1875rem;top:.4375rem;width:.5625rem;height:.5625rem;border-radius:50%;background:var(--text-faint)}

		.timeline-item:last-child{padding-bottom:0}
		.timeline-item:last-child::after{display:none}
		.timeline-event::before{background:var(--accent)}
		.timeline-body{font-size:.875rem;color:var(--text-primary);overflow-wrap:anywhere;white-space:pre-wrap}
		.timeline-change{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
		.timeline-arrow{color:var(--text-secondary)}
		.timeline-meta{margin-top:.1875rem;font-family:var(--font-mono);font-size:.6875rem;color:var(--text-secondary)}
		/* ── KPI strip (components.KPIStrip): one bordered container, divided cells.
		   Delta is arrow + text + colour; colour alone never carries direction. */
		.kpi-strip{display:flex;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-raised);overflow:hidden;margin-bottom:1.25rem}
		.kpi-cell{flex:1 1 0;min-width:0;padding:1rem 1.25rem;border-left:1px solid var(--border-subtle)}
		.kpi-cell:first-child{border-left:0}
		.kpi-label{font-family:var(--font-mono);font-size:.6875rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)}
		.kpi-value{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.25rem;font-family:var(--font-mono);font-size:1.75rem;font-weight:700;line-height:1.2;color:var(--text-primary)}
		.kpi-delta{margin-top:.25rem;font-size:.75rem;font-weight:600;color:var(--text-secondary)}
		.kpi-delta-up{color:var(--positive)}
		.kpi-delta-down{color:var(--negative)}
		.kpi-delta-new{color:var(--info)}
		.kpi-note{font-weight:400;color:var(--text-secondary)}
		/* ── Emphasised list row (resource.Row.Emphasis). Weight, not colour. */
		.crm-table tbody tr.row-emphasis>td{font-weight:600;color:var(--text-primary)}
		/* ── Occupancy board (components.OccupancyBoard): positions x months.

		.occ-zoom{display:flex;gap:.375rem}
		.occ-zoom .is-current{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
		.occ-legend{display:flex;flex-wrap:wrap;gap:.375rem 1rem;margin:0;padding:0;list-style:none;font-size:.75rem;color:var(--text-secondary)}
		.occ-swatch{display:inline-block;min-width:1.125rem;padding:0 .25rem;border-radius:var(--radius);text-align:center;background:var(--tone-bg);color:var(--tone-fg);border:1px solid var(--tone-line)}

		.occ-head,.occ-row{display:grid;grid-template-columns:5.5rem minmax(0,1fr)}

		.occ-months{display:grid}
		.occ-months span{padding:.5rem .375rem;border-left:1px solid var(--border-subtle);white-space:nowrap;overflow:hidden}
		.occ-row{border-bottom:1px solid var(--border-subtle)}

		.occ-gap,.occ-bar{position:absolute;box-sizing:border-box;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.75rem;line-height:1.5rem;text-decoration:none}
		.occ-gap{top:0;bottom:0;padding:.1875rem .375rem;border:1px dashed var(--text-faint);border-radius:var(--radius);color:var(--text-secondary);line-height:1.25rem}
		.occ-mark{position:absolute;box-sizing:border-box;height:1.125rem;display:flex;align-items:center;justify-content:center;border:1px dashed var(--text-faint);border-radius:var(--radius);font-size:.75rem;line-height:1;text-decoration:none;color:var(--text-secondary)}
		a.occ-mark:hover,a.occ-gap:hover{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
		.occ-bar{z-index:1;height:1.625rem;margin-top:.125rem;padding:0 .5rem;border-radius:var(--radius);background:var(--tone-bg);color:var(--tone-fg);border:1px solid var(--tone-line);font-weight:600}
		a.occ-bar:hover{text-decoration:underline}
		.occ-bar:focus-visible,.occ-gap:focus-visible,.occ-mark:focus-visible{outline:2px solid var(--accent);outline-offset:2px;z-index:3}
		.occ-bar.is-clip-l{border-top-left-radius:0;border-bottom-left-radius:0;border-left-style:dotted}
		.occ-bar.is-clip-r{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dotted}
		.occ-bar.is-overlap{box-shadow:0 0 0 2px var(--negative)}
		.occ-sale{--tone-bg:var(--positive-bg);--tone-fg:var(--positive);--tone-line:var(--positive)}
		.occ-hold{--tone-bg:var(--warning-bg);--tone-fg:var(--warning);--tone-line:var(--warning)}
		.occ-renewal{--tone-bg:var(--special-bg);--tone-fg:var(--special);--tone-line:var(--special)}
		.occ-ended{--tone-bg:var(--neutral-bg);--tone-fg:var(--neutral);--tone-line:var(--text-faint)}
		.occ-conflict{--tone-bg:var(--negative-bg);--tone-fg:var(--negative);--tone-line:var(--negative)}
		.occ-bar.occ-hold{border-style:dashed}
		.occ-bar.occ-conflict{background-image:repeating-linear-gradient(135deg,transparent 0 .3125rem,color-mix(in srgb,var(--tone-line) 28%,transparent) .3125rem .375rem)}
		.occ-today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--negative);z-index:2;pointer-events:none}
		.occ-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
		.occ-list{display:none}
		.occ-pos h3{margin:0 0 .375rem;font-size:.875rem}
		.occ-pos ul{margin:0 0 1rem;padding:0;list-style:none;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--bg-raised)}
		.occ-item{display:flex;flex-wrap:wrap;align-items:center;gap:.375rem .625rem;padding:.625rem .875rem;border-bottom:1px solid var(--border-subtle);font-size:.875rem}
		.occ-item:last-child{border-bottom:0}
		.occ-item a{min-height:2.75rem;display:inline-flex;align-items:center;color:var(--accent-text)}
		.occ-range{font-family:var(--font-mono);font-size:.75rem;color:var(--text-secondary)}
		/* ── Narrow screens. */
		@media(max-width:767px){

			.queue-actions .btn{width:100%}
			.stepper{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.25rem}
			.stepper-item,.stepper-sep{flex:0 0 auto;scroll-snap-align:center}

			/* List tables degrade to stacked cards: each row is a card, each cell

			.crm-table[data-stack] tbody tr{display:block;margin-bottom:.625rem;padding:.375rem 0;background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-lg)}

			.crm-table[data-stack] td[colspan]{padding:1rem}
			.crm-table[data-stack] td[colspan]::before{content:none}
		}
