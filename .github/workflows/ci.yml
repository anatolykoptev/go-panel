name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, krolik]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Verify templ codegen is fresh
        env:
          GOWORK: "off"
        run: |
          go tool templ generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
