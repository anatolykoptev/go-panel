name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A go.work in an outer directory would not list the CI checkout, and every
# go command would fail with "directory prefix . does not contain modules
# listed in go.work". Setting it off here makes the build independent of
# whatever the runner's home directory happens to contain.
env:
  GOWORK: "off"

jobs:
  # docs-gate: canonical docs-only detector. Inserted by scripts/docs-gate.rb; the
  # `check` mode compares this block byte for byte, so edit it HERE, never per repo.
  # Spec and failure semantics: ~/.claude/skills/ci-setup/specs/docs-only-fastpath.md
  docs-scope:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # docs_only=true only on a positive, complete answer; every doubt means full CI.
          is_doc() {
            case "$1" in
              *.md | docs/* | doc/* | LICENSE | LICENSE.* | LICENSE-* | COPYING | NOTICE | AUTHORS) return 0 ;;
              .github/ISSUE_TEMPLATE/* | .github/PULL_REQUEST_TEMPLATE* | .github/CODEOWNERS) return 0 ;;
            esac
            return 1
          }
          why=
          touched() { # every touched path (rename sources included); non-zero on any doubt
            local url page=1 resp n
            case "$EVENT" in
              pull_request) url="$API/repos/$REPO/pulls/$PR/files" ;;
              push)
                [ -n "${BEFORE//0/}" ] || { why="push without a usable before sha"; return 1; }
                url="$API/repos/$REPO/compare/$BEFORE...$AFTER" ;;
              *) why="event $EVENT"; return 1 ;;
            esac
            while :; do
              resp=$(curl -fsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$url?per_page=100&page=$page") || { why="API error on page $page"; return 1; }
              if [ "$EVENT" = push ] && [ "$page" = 1 ]; then
                [ "$(jq -r .status <<<"$resp")" = ahead ] || { why="push is not a fast-forward"; return 1; }
              fi
              n=$(jq -r '(if type == "array" then . else .files end) | length' <<<"$resp") || { why="unreadable page $page"; return 1; }
              [[ $n =~ ^[0-9]+$ ]] || { why="unreadable page $page"; return 1; }
              jq -r '(if type == "array" then . else .files end) | .[] | .filename, (.previous_filename // empty)' <<<"$resp" || { why="unreadable page $page"; return 1; }
              # compare lists at most 300 files: 300 or more may be a truncated list
              if [ "$EVENT" = push ] && [ "$n" -ge 100 ]; then why="push may exceed the compare file cap"; [ "$page" -lt 3 ] || return 1; fi
              [ "$n" -ge 100 ] || { why=; return 0; }
              page=$((page + 1))
              [ "$page" -le 30 ] || { why="3000 files or more"; return 1; }
            done
          }
          docs_only=false
          # `if !` keeps errexit off for the whole listing: every doubt is an explicit return 1
          if ! list=$(touched); then
            why=${why:-listing failed}
          elif [ -z "$list" ]; then
            why="no changed paths"
          else
            docs_only=true
            while IFS= read -r f; do is_doc "$f" || { docs_only=false; why="code path: $f"; break; }; done <<<"$list"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs_only${why:+ ($why)}" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: [docs-scope]
    if: ${{ !cancelled() && !(needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs_only == 'true') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - name: Verify templ codegen is fresh
        run: |
          go tool templ generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      # auth/account_test.go's TestPgxAccountStore_RoundTrip (Postgres-backed)
      # is gated on TEST_DATABASE_URL and was SKIPPED here always — no step
      # ever set that var, so it never ran in CI (silent coverage gap since
      # PR #34). `make preflight-db` (scripts/preflight-db.sh) provisions an
      # ephemeral Postgres (docker-assigned port, torn down via trap on exit)
      # and sets TEST_DATABASE_URL for a run-set DERIVED from the actual
      # TEST_DATABASE_URL references in ./auth/*_test.go, not the whole
      # ./auth/... package — see the script for why running the whole
      # package isn't optional-but-nicer on this runner, it times out.
      # Invoked via the Makefile target (not the script path directly) so
      # local dev and CI can never silently diverge on how this runs.
      - name: DB-gated tests (auth, ephemeral Postgres)
        run: make preflight-db
      - uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with Go >= the go.mod toolchain (the action installs a
          # prebuilt binary; v2.11.4's go1.26 build refuses a go1.27 target).
          version: v2.14.0
      # Dependency-CVE gate. Pinned (not @latest, see Makefile `vuln` target)
      # so a new govulncheck release can't silently change what gates the
      # merge, and named so a CVE finding shows up as its own red step
      # instead of a generic "ci" failure.
      - name: govulncheck (CVE gate)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
