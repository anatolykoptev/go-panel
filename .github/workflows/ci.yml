name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The krolik runner's $HOME carries a go.work that does not list CI checkouts;
# without GOWORK=off every go command fails with "directory prefix . does not
# contain modules listed in go.work".
env:
  GOWORK: "off"

jobs:
  check:
    runs-on: [self-hosted, krolik]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - name: Verify templ codegen is fresh
        run: |
          go tool templ generate ./...
          git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      # auth/account_test.go's TestPgxAccountStore_RoundTrip (Postgres-backed)
      # is gated on TEST_DATABASE_URL and was SKIPPED here always — no step
      # ever set that var, so it never ran in CI (silent coverage gap since
      # PR #34). scripts/preflight-db.sh provisions an ephemeral Postgres
      # (docker-assigned port, torn down via trap on exit) and sets
      # TEST_DATABASE_URL for the TestPgxAccountStore_* tests only (the
      # DB-gated ones — see the script for why it filters by test name
      # instead of running the whole ./auth/... package, and why that isn't
      # optional on this runner).
      - name: DB-gated tests (auth, ephemeral Postgres)
        run: ./scripts/preflight-db.sh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
      # Dependency-CVE gate. Pinned (not @latest, see Makefile `vuln` target)
      # so a new govulncheck release can't silently change what gates the
      # merge, and named so a CVE finding shows up as its own red step
      # instead of a generic "ci" failure.
      - name: govulncheck (CVE gate)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
